name: Monorepo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner's shared Rustup home is outside the plugin's virtual paths.
      - name: Use a Rustup home visible to proto and Moon
        run: echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: moon run rust:verify

name: Monorepo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Moon diffs touched files against vcs.defaultBranch (main), which a
          # shallow pull-request checkout does not contain.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # proto's native Rust install on this runner registers the pinned
      # toolchain without cargo/rustc/rust-std, and the toolchain cache saved
      # by the first failed run keeps that incomplete toolchain. Complete it
      # before Moon locates Cargo. The version comes from rust-toolchain.toml.
      - name: Ensure base Rust components
        run: rustup component add cargo rustc rust-std
      - run: moon run rust:verify

name: Monorepo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Ensure a registered but incomplete toolchain has the compiler binaries
      # before Moon locates Cargo. The version comes from rust-toolchain.toml.
      - name: Ensure base Rust components
        run: rustup component add cargo rustc rust-std
      - run: moon run rust:verify
